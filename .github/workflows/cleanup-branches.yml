name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Delete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "checkpoint/v0.13.0-2e49bbe"
            "dependabot/github_actions/actions/checkout-7.0.1"
            "dependabot/github_actions/actions/deploy-pages-5.0.1"
            "dependabot/github_actions/actions/upload-pages-artifact-5.0.0"
            "dependabot/pip/reader-dependencies-c1499e6f0f"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
